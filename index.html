<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevQuiz: quiz de Java para principiantes." />
    <title>DevQuiz | Terminal de Java</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="site-header">
        <p class="eyebrow"><span class="eyebrow-dot"></span> devquiz.exe</p>
        <h1>Aprendé Java desde la terminal.</h1>
        <p class="subtitle">Respondé como si estuvieras ejecutando código en una consola real.</p>
      </header>

      <section class="terminal-window" aria-labelledby="terminal-title">
        <div class="terminal-chrome">
          <div class="window-controls" aria-hidden="true">
            <span class="window-control close"></span>
            <span class="window-control minimize"></span>
            <span class="window-control maximize"></span>
          </div>
          <p id="terminal-title">student@devquiz: ~/java-basics</p>
          <span class="terminal-menu" aria-hidden="true">•••</span>
        </div>

        <div class="terminal-body" id="terminal-body" tabindex="-1">
          <div class="terminal-output" id="terminal-output" aria-live="polite"></div>
          <form class="terminal-prompt" id="terminal-form">
            <label class="prompt-label" for="terminal-input"><span class="prompt-user">student</span><span class="prompt-at">@</span><span class="prompt-host">devquiz</span><span class="prompt-path">:~$</span></label>
            <input id="terminal-input" class="terminal-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Escribí tu respuesta" autofocus />
            <textarea id="terminal-editor" class="terminal-editor" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Escribí tu código Java" hidden></textarea>
            <button id="skip-exercise" class="skip-button" type="button" hidden>Saltar ejercicio →</button>
          </form>
        </div>

        <div class="terminal-statusbar">
          <span><span class="status-pulse"></span> JAVA 17</span>
          <span id="terminal-mode">QUIZ MODE</span>
          <span id="terminal-progress">01 / 10</span>
        </div>
      </section>

      <section class="quiz-meta" aria-label="Estado del quiz">
        <div class="meta-item"><span class="meta-label">PROGRESO</span><div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div></div>
        <div class="meta-item meta-score"><span class="meta-label">SCORE</span><strong id="score-badge">0</strong><span>pts</span></div>
      </section>

      <footer class="site-footer"><span>Escribí A, B, C o D y presioná Enter</span><span class="footer-separator">//</span><span>Ctrl + R para reiniciar</span></footer>
    </main>
    <script src="quiz.js"></script>
    <script src="app.js"></script>
  </body>
</html>
